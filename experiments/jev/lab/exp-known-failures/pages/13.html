<script type="application/ld+json">{"@context":"http://schema.org","@type":"QAPage","name":"Change grafana.ini in docker install","datePublished":"2020-03-24T13:50:48.264Z","mainEntity":{"@type":"Question","answerCount":5,"author":{"@type":"Person","name":"patwiken","url":"https://community.grafana.com/u/patwiken"},"dateModified":"2020-03-24T13:50:48.356Z","datePublished":"2020-03-24T13:50:48.264Z","name":"Change grafana.ini in docker install","text":"I am using grafana with a basic docker installation. How can I change the grafana.ini file inside the docker to set up new logs level?","upvoteCount":0,"suggestedAnswer":[{"@type":"Answer","author":{"@type":"Person","name":"agnestoulet1","url":"https://community.grafana.com/u/agnestoulet1"},"dateModified":"2020-03-25T08:25:05.059Z","datePublished":"2020-03-25T08:25:05.043Z","text":"Hi,\n\nYou can use Docker volumes to map your local config file to docker file as below:\n\ndocker run --rm --mount type=bind,source=$PWD/custom.ini,target=/etc/grafana/grafana.ini -p 3000:3000 grafana/grafana\n\nIf it’s only for a small set of settings, you can also use environment variables:\n\ndocker ru\u0026hellip;","upvoteCount":2,"url":"https://community.grafana.com/t/change-grafana-ini-in-docker-install/27605/2"},{"@type":"Answer","author":{"@type":"Person","name":"patwiken","url":"https://community.grafana.com/u/patwiken"},"dateModified":"2020-03-25T17:56:45.724Z","datePublished":"2020-03-25T17:56:45.715Z","text":"Thanks, I used this in a docker compose file and it seems to be good","upvoteCount":0,"url":"https://community.grafana.com/t/change-grafana-ini-in-docker-install/27605/3"},{"@type":"Answer","author":{"@type":"Person","name":"mfscorp","url":"https://community.grafana.com/u/mfscorp"},"dateModified":"2020-12-08T11:36:02.967Z","datePublished":"2020-12-08T11:36:02.957Z","text":"hi Patwiken\n\ni would like to do the same.\n\ncan you share me what you entered in the compose file?","upvoteCount":0,"url":"https://community.grafana.com/t/change-grafana-ini-in-docker-install/27605/4"},{"@type":"Answer","author":{"@type":"Person","name":"mvadu","url":"https://community.grafana.com/u/mvadu"},"dateModified":"2021-02-01T03:57:04.385Z","datePublished":"2021-02-01T03:57:04.373Z","text":"You just use the config as another volume.\n\nvolumes:\n\n- ./volumes/grafana/data:/var/lib/grafana\n\n- ./volumes/grafana/log:/var/log/grafana\n\n- ./volumes/grafana/config/custom.ini:/etc/grafana/grafana.ini","upvoteCount":0,"url":"https://community.grafana.com/t/change-grafana-ini-in-docker-install/27605/5"},{"@type":"Answer","author":{"@type":"Person","name":"waldomantilla","url":"https://community.grafana.com/u/waldomantilla"},"dateModified":"2021-08-22T06:57:18.505Z","datePublished":"2021-08-22T06:57:18.495Z","text":"Here is an example of how to include environmental variables to change the Grafana configuration using docker-compose. With this solved this issue #\u003ca href=\"https://github.com/grafana/grafana/issues/36929\" rel=\"noopener nofollow ugc\"\u003ehttps://github.com/grafana/grafana/issues/36929\u003c/a\u003e\n\nversion: \u0026#39;3.7\u0026#39;\n\nservices:\n\ngrafana:\n\nimage: grafana/grafana\n\ncontainer_name: grafana_container\n\n\u0026hellip;","upvoteCount":0,"url":"https://community.grafana.com/t/change-grafana-ini-in-docker-install/27605/6"}]}}</script>

oulet1\",\"username\":\"agnestoulet1\",\"avatar_template\":\"https://avatars.discourse-cdn.com/v4/letter/a/dec6dc/{size}.png\",\"created_at\":\"2020-03-25T08:25:05.043Z\",\"cooked\":\"\\u003cp\\u003eHi,\\u003c/p\\u003e\\n\\u003cp\\u003eYou can use Docker volumes to map your local config file to docker file as below:\\u003c/p\\u003e\\n\\u003cpre\\u003e\\u003ccode class=\\\"lang-auto\\\"\\u003e docker run --rm --mount type=bind,source=$PWD/custom.ini,target=/etc/grafana/grafana.ini -p 3000:3000 grafana/grafana\\n\\u003c/code\\u003e\\u003c/pre\\u003e\\n\\u003cp\\u003eIf it’s only for a small set of settings, you can also use environment variables:\\u003c/p\\u003e\\n\\u003cpre\\u003e\\u003ccode class=\\\"lang-auto\\\"\\u003edocker run --rm -e \\\"GF_USERS_DEFAULT_THEME=light\\\" -p 3000:3000 grafana/grafana\\n\\u003c/code\\u003e\\u003c/pre\\u003e\",\"post_number\":2,\"post_type\":1,\"posts_count\":6,\"updated_at\":\"2020-03-25T08:25:05.043Z\",\"reply_count\":0,\"reply_to_post_number\":null,\"quote_count\":0,\"incoming_link_count\":352,\"reads\":375,\"readers_count\":374,\"score\":1865.0,\"yours\":false,\"topic_id\":27605,\"topic_slug\":\"change-grafana-ini-in-docker-install\",\"display_username\":\"Agnestoulet1\",\"primary_group_name\":\"grafana-labs-team\",\"flair_name\":\"grafana-labs-team\",\"flair_url\":\"https://us1.discourse-cdn.com/grafana/original/3X/7/e/7e1b2401816c00e38f1667d1900f049fb269c7cd.png\",\"flair_bg_color\":\"\",\"flair_color\":\"\",\"flair_group_id\":42,\"badges_granted\":[],\"version\":1,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"read\":true,\"user_title\":null,\"bookmarked\":false,\"actions_summary\":[{\"id\":2,\"count\":2}],\"moderator\":false,\"admin\":false,\"staff\":false,\"user_id\":11862,\"hidden\":false,\"trust_level\":1,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":false,\"wiki\":false,\"post_url\":\"/t/change-grafana-ini-in-do               <span class="creator" itemprop="author" itemscope="itemscope" itemtype="http://schema.org/Person">
                <a rel='nofollow' href='https://community.grafana.com/u/patwiken'><span itemprop="name">patwiken</span></a>
                  <meta itemprop='url' content='https://community.grafana.com/u/patwiken'>
                
              </span>



              <span class="crawler-post-infos">
                  <time  datetime='2020-03-24T13:50:48Z' class='post-time'>
                    March 24, 2020,  1:50pm
                  </time>
                  <meta itemprop='dateModified' content='2020-03-24T13:50:48Z'>
              <span itemprop="position">1</span>
              </span>
            </div>
            <div class='post' itemprop="text">
              <p>I am using grafana with a basic docker installation. How can I change the grafana.ini file inside the docker to set up new logs level?</p>
            </div>


                <div class='crawler-linkback-list'>
                    <div>
                      <a href="https://community.grafana.com/t/custom-configuration-grafana-ini-docker/29553/4">Custom configuration grafana.ini docker</a>
                    </div>
                </div>

            


          </div>
          <div id='post_2' itemprop="suggestedAnswer" itemscope="itemscope" itemtype="https://schema.org/Answer" class='topic-body crawler-post'>
            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope="itemscope" itemtype="http://schema.org/Person">
                <a rel='nofollow' href='https://community.grafana.com/u/agnestoulet1'><span itemprop="name">agnestoulet1</span></a>
                  <meta itemprop='url' content='https://community.grafana.com/u/agnestoulet1'>
                
              </span>



              <span class="crawler-post-infos">
                  <time itemprop="datePublished" datetime='2020-03-25T08:25:05Z' class='post-time'>
                    March 25, 2020,  8:25am
                  </time>
                  <meta itemprop='dateModified' content='2020-03-25T08:25:05Z'>
              <span itemprop="position">2</span>
              </span>
            </div>
            <div class='post' itemprop="text">
              <p>Hi,</p>
<p>You can use Docker volumes to map your local config file to docker file as below:</p>
<pre><code class="lang-auto"> docker run --rm --mount type=bind,source=$PWD/custom.ini,target=/etc/grafana/grafana.ini -p 3000:3000 grafana/grafana
</code></pre>
<p>If it’s only for a small set of settings, you can also use environment variables:</p>
<pre><code class="lang-auto">docker run --rm -e "GF_USERS_DEFAULT_THEME=light" -p 3000:3000 grafana/grafana
</code></pre>
            </div>



            

<meta itemprop='upvoteCount' content='2'><meta itemprop='url' content='https://community.grafana.com/t/change-grafana-ini-in-docker-install/27605/2'>

<meta itemprop='upvoteCount' content='0'><meta itemprop='url' content='https://community.grafana.com/t/change-grafana-ini-in-docker-install/27605/4'>

          <div id='post_5' itemprop="suggestedAnswer" itemscope="itemscope" itemtype="https://schema.org/Answer" class='topic-body crawler-post'>
            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope="itemscope" itemtype="http://schema.org/Person">
                <a rel='nofollow' href='https://community.grafana.com/u/mvadu'><span itemprop="name">mvadu</span></a>
                  <meta itemprop='url' content='https://community.grafana.com/u/mvadu'>
                
              </span>



              <span class="crawler-post-infos">
                  <time itemprop="datePublished" datetime='2021-02-01T03:57:04Z' class='post-time'>
                    February 1, 2021,  3:57am
                  </time>
                  <meta itemprop='dateModified' content='2021-02-01T03:57:04Z'>
              <span itemprop="position">5</span>
              </span>
            </div>
            <div class='post' itemprop="text">
              <p>You just use the config as another volume.</p>
<pre><code class="lang-auto">   volumes:
    - ./volumes/grafana/data:/var/lib/grafana
    - ./volumes/grafana/log:/var/log/grafana
    - ./volumes/grafana/config/custom.ini:/etc/grafana/grafana.ini
</code></pre>
            </div>



            

<meta itemprop='upvoteCount' content='0'><meta itemprop='url' content='https://community.grafana.com/t/change-grafana-ini-in-docker-install/27605/5'>
          </div>
          <div id='post_6' itemprop="suggestedAnswer" itemscope="itemscope" itemtype="https://schema.org/Answer" class='topic-body crawler-post'>
            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope="itemscope" itemtype="http://schema.org/Person">
                <a rel='nofollow' href='https://community.grafana.com/u/waldomantilla'><span itemprop="name">waldomantilla</span></a>
                  <meta itemprop='url' content='https://community.grafana.com/u/waldomantilla'>
                
              </span>



              <span class="crawler-post-infos">
                  <time itemprop="datePublished" datetime='2021-08-22T06:57:18Z' class='post-time'>
                    August 22, 2021,  6:57am
                  </time>
                  <meta itemprop='dateModified' content='2021-08-22T06:57:18Z'>
              <span itemprop="position">6</span>
              </span>
            </div>
            <div class='post' itemprop="text">
              <p>Here is an example of how to include environmental variables to change the Grafana configuration using docker-compose. With this solved this issue #<a href="https://github.com/grafana/grafana/issues/36929" rel="noopener nofollow ugc">https://github.com/grafana/grafana/issues/36929</a></p>
<pre><code class="lang-auto">version: '3.7'
services:
  grafana:
    image: grafana/grafana
    container_name: grafana_container
    restart: always
    ports:
      - 3000:3000
    networks:
      - monitoring_network
    volumes:
      - grafana-volume:/var/lib/grafana
    environment:
      - GF_LIVE_MAX_CONNECTIONS=0
  influxdb:
    image: influxdb:1.8.6
    container_name: influxdb_container
    restart: always
    ports:
      - 8086:8086
    networks:
      - monitoring_network
    volumes:
      - influxdb-volume:/var/lib/influxdb
networks:
  monitoring_network:
volumes:
  grafana-volume:
    external: true
  influxdb-volume:
    external: true</code></pre>
